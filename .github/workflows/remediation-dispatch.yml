name: Remediation dispatch

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
    branches: [master]

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch remediation pipeline
        env:
          DISPATCH_TOKEN: ${{ secrets.REMEDIATION_DISPATCH_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/victorciao/devin-remediation-pipeline/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"codeql-scan-completed\",\"client_payload\":{\"head_sha\":\"${HEAD_SHA}\",\"run_id\":${RUN_ID},\"html_url\":\"${RUN_URL}\"}}" \
            >/dev/null
